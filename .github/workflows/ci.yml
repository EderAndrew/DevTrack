# Continuous integration (specs/002-stack-alignment/contracts/ci-and-e2e.md, research S15).
# Lint, types, build and tests of every workspace on each push and pull request; any failing step
# fails the check (SC-009). No secrets: the tests use apps/api/.env.test.example and InMemoryMailer
# (FR-037). The E2E suite runs locally only (clarification Q2 → C). Since 019 the job `sandbox` runs the
# Code Runner's real-Docker suite.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, build e testes
    runs-on: ubuntu-latest
    # The full suite reached ~20 min with 015 (2026-10-08); keep headroom over it.
    timeout-minutes: 40
    services:
      # Test database of the API suite (FR-036); same values as apps/api/.env.test.example.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      # Actions pinned by commit SHA (Constitution, Principle I: software supply chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the web build numbers its version by commit count (apps/web/next.config.js).
          fetch-depth: 0

      # pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Also runs `prisma generate` (postinstall of apps/api).
      - run: pnpm install --frozen-lockfile

      - run: cp apps/api/.env.test.example apps/api/.env.test

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm build

      - run: pnpm test

  # 019 (research B14): the Code Runner against the real Docker of the runner (runc), with the three
  # pinned images: the languages end to end, the verdict table, the hostile suite (SC-003) and the
  # SC-001 timing. The default suite above uses the FakeSandbox. gVisor (`runsc`) is checked on the
  # worker host itself (docs/deploy/code-runner.md), not here.
  sandbox:
    name: Code Runner (Docker real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The sandbox suite shares the API suite's global setup (migrations on the test database).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp apps/api/.env.test.example apps/api/.env.test

      # `code-runner:images` runs dist/ (the API and the contracts it imports).
      - run: pnpm --filter api... build

      - run: pnpm --filter api code-runner:images

      - run: pnpm --filter api test:sandbox
