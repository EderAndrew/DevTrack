# Deploy of the beta on the Hostinger VPS (docs/deploy/hostinger.md, section 12). After the CI of a push to
# main passes, connects to the VPS as `devtrack` with a key that can only run deploy/hostinger/update.sh
# (a forced command in authorized_keys), then checks the site and the API's readiness through nginx.
# Repository secrets (Settings → Secrets and variables → Actions): VPS_HOST, VPS_PORT, VPS_USER, SSH_KEY;
# host, port and user may also be repository variables.
# No action from the marketplace: only ssh and curl of the runner. Manual runs (workflow_dispatch) deploy
# main too, e.g. to retry.
name: Deploy (Hostinger)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, never cancelled halfway (a cancelled build would leave the VPS half updated).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar a VPS da Hostinger
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
    steps:
      - name: Chave SSH e chave da VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          for name in VPS_HOST VPS_USER SSH_KEY; do
            [ -n "${!name}" ] || { echo "::error::Falta o segredo $name (Settings → Secrets and variables → Actions)."; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS's host key is read now (no fixed known_hosts): the key's forced command means an
          # impostor host would get nothing it could use.
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Rodar o update.sh na VPS
        # The key's forced command runs update.sh whatever is asked here.
        run: >-
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$VPS_USER@$VPS_HOST" deploy

      - name: Verificar o site e a API
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors https://devtrack.nativcode.com.br/entrar
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://devtrack.nativcode.com.br/api/health/ready

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
