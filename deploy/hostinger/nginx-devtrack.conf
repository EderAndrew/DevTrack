# nginx site of the DevTrack beta (docs/deploy/hostinger.md). Copy to /etc/nginx/sites-available/devtrack,
# link it into sites-enabled and run `certbot --nginx -d devtrack.nativcode.com.br`, which adds the
# 443 block and the redirect from 80.
server {
    listen 80;
    server_name devtrack.nativcode.com.br;

    # Syllabus uploads are up to 10 MB plus the multipart envelope (004); the API enforces the real limit.
    client_max_body_size 11m;

    location / {
        # Everything goes to the web app; Next.js rewrites /api/* to the API on 127.0.0.1:4010.
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Replaced, never appended, so a client can't plant an address. Next.js keeps a header it receives
        # (it only fills a missing one), so the API sees exactly this entry: TRUST_PROXY_HOPS=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
