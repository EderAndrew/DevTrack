# nginx site of the DevTrack beta (docs/deploy/hostinger.md). Copy to /etc/nginx/sites-available/devtrack,
# link it into sites-enabled and run `certbot --nginx -d devtrack.nativcode.com.br`, which adds the
# 443 block and the redirect from 80.
server {
    listen 80;
    server_name devtrack.nativcode.com.br;

    # Syllabus uploads are up to 10 MB plus the multipart envelope (004); the API enforces the real limit.
    client_max_body_size 11m;

    # Security headers, on every response (`always`: also on errors). certbot keeps them in the 443 block.
    # HSTS without includeSubDomains: the VPS and the domain are shared with other sites.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # No script/style sources: Next.js renders inline scripts, which a strict CSP would need nonces for.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Fullscreen and clipboard stay allowed: the exam (018) and the controlled mode (015) use them.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # No Referrer-Policy here: Next.js sends `no-referrer` on the token pages, and a second header would
    # combine with it and the last value would win (next.config.js).

    location / {
        # Everything goes to the web app; Next.js rewrites /api/* to the API on 127.0.0.1:4010.
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Replaced, never appended, so a client can't plant an address. Next.js keeps a header it receives
        # (it only fills a missing one), so the API sees exactly this entry: TRUST_PROXY_HOPS=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
