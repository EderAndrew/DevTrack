packages:
  - "apps/*"
  - "packages/*"
# Single Zod version for api, web and @repo/contracts (002 S2, FR-007).
catalog:
  zod: ^4.6.7
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  prisma: true
# Security overrides of transitive dependencies (T110, DEPENDENCIES.md).
overrides:
  body-parser@2: ^2.4.0
  fast-uri@3: ^3.1.9
  vite@8: ^8.3.3
